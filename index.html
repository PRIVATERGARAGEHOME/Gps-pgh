<!doctype html>
<html lang="id">
<head>

<title>RaceLab GPS — LCD Device UI</title>
<style>
:root{--case:#171819;--case2:#292a2b;--lcd:#b8b9b1;--lcd-hi:#d3d4ca;--ink:#181a18;--dim:#565a54;--red:#c63235;--line:#73766e;--white:#f0f0ec}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#3a3b3b 0,#171819 45%,#090a0a 100%);color:var(--white);font-family:Arial,Helvetica,sans-serif;padding:16px 12px 28px;display:flex;justify-content:center;align-items:center}
.wrap{width:min(100%,900px)}.device{padding:14px;border-radius:27px;background:linear-gradient(140deg,#5a5b5c 0,#171819 13%,#080909 48%,#3e3f40 80%,#111 100%);box-shadow:0 24px 55px #000a,inset 0 1px 1px #aaa; border:1px solid #555;}
.device-brand{height:27px;display:flex;align-items:center;justify-content:space-between;padding:0 5px 9px;font-size:10px;letter-spacing:2px;font-weight:900;color:#bfc0c0}.device-brand span{color:#e34a4d}.device-brand small{font-size:8px;letter-spacing:1px;color:#777}

.lcd:after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,#00000008 0px,#00000008 1px,transparent 1px,transparent 3px);opacity:.4}
.lcd-top{height:27px;display:flex;justify-content:space-between;align-items:center;padding:4px 8px;border-bottom:1px solid #777a72;font-size:11px;position:relative;z-index:1}.status-icons{display:flex;gap:7px;align-items:center}.signal{display:inline-flex;gap:2px;align-items:flex-end;height:12px}.signal i{display:block;width:3px;background:#66695f}.signal i:nth-child(1){height:4px}.signal i:nth-child(2){height:7px}.signal i:nth-child(3){height:10px}.signal.good i{background:#22251f}.screen{position:relative;z-index:1;min-height:278px;padding:8px 9px 10px}.screen-title{font-size:12px;text-align:center;letter-spacing:1px;padding:4px 0 7px;border-bottom:1px solid #7e8178;margin-bottom:7px}.menu-list{display:flex;flex-direction:column;gap:3px}.menu-row{display:flex;align-items:center;min-height:35px;padding:4px 7px;font-size:13px;letter-spacing:.2px}.menu-row .arr{width:18px;flex:none}.menu-row .value{margin-left:auto;font-size:11px}.menu-row.selected{background:#282b27;color:#e3e5dc;outline:1px solid #282b27}.menu-row.selected .value{color:#fff}.screen-footer{position:absolute;left:0;right:0;bottom:0;border-top:1px solid #85877f;padding:5px 7px;display:flex;justify-content:space-between;font-size:9px;color:#3f433d;background:#b4b6ad}.center-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-height:255px;gap:8px}.boot-logo{font-size:31px;letter-spacing:-2px;font-weight:900}.boot-logo span{color:#b82d31}.boot-line{width:65%;height:3px;background:#b82d31}.tiny{font-size:10px;letter-spacing:.6px}.large-speed{font-size:52px;line-height:1;letter-spacing:-4px}.unit{font-size:12px}.discipline-table{width:100%;border-collapse:collapse;font-size:11px}.discipline-table th,.discipline-table td{text-align:left;padding:6px 3px;border-bottom:1px solid #85877e}.discipline-table th{font-size:9px;color:#454941}.discipline-table td:last-child,.discipline-table th:last-child{text-align:right}.run-top{display:flex;justify-content:space-between;align-items:center;font-size:10px;padding:2px 0 6px;border-bottom:1px solid #85877e}.run-speed{font-size:47px;letter-spacing:-3px;line-height:1.15;text-align:center;margin:12px 0 1px}.run-metrics{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid #85877e;margin-top:10px}.run-metric{padding:9px 5px}.run-metric+ .run-metric{border-left:1px solid #85877e}.run-metric label{display:block;font-size:9px;color:#4f534b}.run-metric strong{display:block;font-size:19px;margin-top:4px}.progress{height:5px;background:#8b8d85;margin-top:8px}.progress span{height:100%;display:block;width:0;background:#33362f}.device-buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:13px 3px 2px}.hwbtn{height:47px;border-radius:9px;border:1px solid #050606;background:linear-gradient(180deg,#444647,#151617 60%,#090a0a);box-shadow:0 3px 0 #050505,inset 0 1px #737475;color:#e6e6e4;font-size:20px;font-weight:800;touch-action:manipulation}.hwbtn:active{transform:translateY(2px);box-shadow:0 1px 0 #050505}.hwbtn small{display:block;font-size:7px;letter-spacing:1px;color:#9a9b9b;margin-top:1px}.hwbtn.enter{color:#f5f5f0}.hardware-legend{display:flex;justify-content:space-between;padding:8px 6px 0;color:#7f8080;font-size:8px;letter-spacing:1.3px}.help{font-size:11px;line-height:1.5;color:#aaa;text-align:center;margin:15px 6px 0}.statusline{color:#e8e8e5;font-size:11px;text-align:center;margin:10px 0 0;min-height:16px}.textbtn{font:inherit;border:1px solid #70736a;background:#c7c9bf;color:#171916;padding:4px 8px;text-transform:uppercase;font-size:10px;font-weight:800}
@media(max-width:600px) and (orientation:portrait){body{padding:10px 7px}.wrap{width:min(100%,520px)}.device{padding:9px;border-radius:20px}.lcd{min-height:300px}.screen{padding:7px;min-height:268px}.menu-row{min-height:33px;font-size:12px}.large-speed{font-size:46px}.run-speed{font-size:43px}.hwbtn{height:43px}}
@media (orientation:landscape){body{min-height:100dvh;padding:5px 12px;align-items:center}.wrap{width:min(100%,1000px)}.device{padding:9px 12px;border-radius:22px}.device-brand{height:20px;padding-bottom:4px;font-size:9px}.lcd{min-height:0;height:calc(100dvh - 112px);max-height:560px}.lcd-top{height:22px;font-size:10px;padding:2px 8px}.screen{min-height:0;height:calc(100% - 22px);padding:5px 10px 7px;overflow:auto}.screen-title{font-size:11px;padding:2px 0 4px;margin-bottom:4px}.menu-list{gap:2px}.menu-row{min-height:27px;padding:3px 7px;font-size:12px}.center-screen{min-height:0;height:100%;gap:5px}.boot-logo{font-size:25px}.large-speed{font-size:42px}.run-speed{font-size:38px;margin:4px 0}.run-metrics{margin-top:4px}.run-metric{padding:5px}.run-metric strong{font-size:16px;margin-top:2px}.device-buttons{grid-template-columns:repeat(4, minmax(48px,75px));justify-content:center;gap:8px;margin:7px 3px 0}.hwbtn{height:35px;font-size:16px}.hwbtn small{font-size:6px;margin-top:0}.hardware-legend{padding-top:4px;font-size:7px}.statusline{margin:5px 0 0;font-size:10px}.help{margin:5px 6px 0;font-size:9px;line-height:1.25}}
@media (orientation:landscape) and (max-height:420px){.lcd{height:calc(100dvh - 88px)}.device-brand{height:16px}.device-buttons{margin-top:5px}.hwbtn{height:30px}.hardware-legend,.help{display:none}.statusline{margin-top:3px}}
</style></head><body><main class="wrap"><div class="device"><div class="device-brand"><div>RACE<span>LAB</span> <small>PERFORMANCE METER</small></div><div>RL · GPS</div></div><div class="lcd"><div class="lcd-top"><span id="clock">00:00:00</span><span class="status-icons"><span id="gpsText">NO FIX</span><span class="signal" id="signal"><i></i><i></i><i></i></span><span id="battery">▰</span></span></div><div class="screen" id="screen"></div></div><div class="device-buttons"><button class="hwbtn" id="up" aria-label="Up">▲<small>UP</small></button><button class="hwbtn" id="down" aria-label="Down">▼<small>DOWN</small></button><button class="hwbtn" id="back" aria-label="Back">◀<small>BACK</small></button><button class="hwbtn enter" id="enter" aria-label="Enter">▶<small>ENTER</small></button></div><div class="hardware-legend"><span>RACELAB GPS</span><span>GPS PERFORMANCE SYSTEM</span></div></div><div class="statusline" id="statusline">Pilih ENTER untuk menyalakan layar.</div><div class="help">Kontrol seperti perangkat: ▲▼ untuk memilih · ▶ ENTER untuk masuk · ◀ BACK untuk kembali. Tombol fisik disimulasikan dengan tombol sentuh.</div></main>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const RK='racelab_lcd_records_v1',SK='racelab_lcd_state_v1';let page='boot',sel=0,subSel=0,mode='Distance',target=200,custom=200,watch=null,gps=false,fix=false,last=null,test=null,records=[],msg='Pilih ENTER untuk menyalakan layar.',lastSummary=null,settings={units:'km/h',rollout:'OFF',brightness:'100%'};const menus=['Lap Timer','Drag Meter','History','Settings'];const distModes=['60 ft','100 m','200 m','400 m','Custom'];const speedModes=['0–60 km/h','0–100 km/h','100–200 km/h','0–200 km/h'];try{records=JSON.parse(localStorage.getItem(RK)||'[]');if(!Array.isArray(records))records=[]}catch{}try{const s=JSON.parse(localStorage.getItem(SK)||'{}');settings={...settings,...(s.settings||{})}}catch{}
function save(){try{localStorage.setItem(RK,JSON.stringify(records));localStorage.setItem(SK,JSON.stringify({settings}))}catch{}}function status(t){msg=t;$('statusline').textContent=t}function clock(){let d=new Date();$('clock').textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(x=>String(x).padStart(2,'0')).join(':')}setInterval(clock,1000);clock();function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function top(title){return `<div class="screen-title">${title}</div>`}function footer(left='SELECT',right='BACK'){return `<div class="screen-footer"><span>${left}</span><span>${right}</span></div>`}function rows(items,idx){return `<div class="menu-list">${items.map((it,i)=>`<div class="menu-row ${i===idx?'selected':''}"><span class="arr">${i===idx?'▶':''}</span><span>${it.label||it}</span><span class="value">${it.value||''}</span></div>`).join('')}</div>`}function render(){const s=$('screen');$('gpsText').textContent=fix?'GPS FIX':gps?'SEARCH':'NO FIX';$('signal').className='signal '+(fix?'good':'');if(page==='boot'){s.innerHTML=`<div class="center-screen"><div class="boot-logo">RACE<span>LAB</span></div><div class="tiny">GPS PERFORMANCE METER</div><div class="boot-line"></div><div class="tiny">SYSTEM READY</div><div class="tiny" style="margin-top:22px">▶ PRESS ENTER</div></div>`}
else if(page==='main'){s.innerHTML=top('MAIN MENU')+rows(menus,sel)+footer('▲▼ SELECT','▶ ENTER')}
else if(page==='dragModes'){let a=[{label:'Speed',value:'▶'},{label:'Distance',value:'▶'},{label:'Custom',value:'▶'}];s.innerHTML=top('DRAG METER')+rows(a,sel)+footer('▲▼ SELECT','▶ ENTER')}
else if(page==='discipline'){let items=(mode==='Speed'?speedModes:mode==='Distance'?distModes:['Custom interval','Set distance']);s.innerHTML=top('SELECT '+mode.toUpperCase())+rows(items.map((x,i)=>({label:x,value:(mode==='Distance'&&x===String(target)+' m')?'✓':''})),sel)+footer('▲▼ SELECT','▶ START')}
else if(page==='countdown'){s.innerHTML=`<div class="center-screen"><div class="tiny">DRAG METER / READY</div><div class="count-number">${test.count}</div><div class="tiny">GET READY</div><div class="boot-line"></div><div class="tiny">STARTING SEQUENCE</div></div>`+footer('','PLEASE WAIT')}
else if(page==='go'){s.innerHTML=`<div class="center-screen go-screen"><div class="tiny">DRAG METER</div><div class="go-word">GO!</div><div class="tiny">MOVE TO START TEST</div><div class="boot-line"></div><div class="tiny">GPS MOTION DETECTION</div></div>`+footer('','WAITING')}
else if(page==='running'){const elapsed=Date.now()-(test.startTime||Date.now());const spd=test.speed||0;let tLabel=mode==='Speed'?test.targetLabel:target+' m';s.innerHTML=`<div class="run-top"><span>DRAG METER / ${mode.toUpperCase()}</span><span>${fix?'GPS FIX':'NO FIX'}</span></div><div class="run-speed">${spd.toFixed(1)}<div class="unit">${settings.units.toUpperCase()}</div></div><table class="discipline-table"><thead><tr><th>DISCIPLINE</th><th>TIME</th></tr></thead><tbody><tr><td>${esc(tLabel)}</td><td>${elapsedFmt(elapsed)}</td></tr></tbody></table><div class="run-metrics"><div class="run-metric"><label>DISTANCE</label><strong>${test.distance.toFixed(1)} m</strong></div><div class="run-metric"><label>TOP SPEED</label><strong>${test.top.toFixed(1)}</strong></div></div><div class="progress"><span style="width:${Math.min(100,test.distance/Math.max(1,test.target)*100)}%"></span></div>${footer('▲▼ DISPLAY','◀ END RUN')}`}
else if(page==='summary'){let r=lastSummary||{};s.innerHTML=top('RUN SUMMARY')+`<table class="discipline-table"><tbody><tr><td>STATUS</td><td>${esc(r.status||'FINISH')}</td></tr><tr><td>DISTANCE</td><td>${Number(r.distance_m||0).toFixed(1)} m</td></tr><tr><td>TIME</td><td>${elapsedFmt(r.time_ms||0)}</td></tr><tr><td>TOP SPEED</td><td>${Number(r.top_speed_kmh||0).toFixed(1)} km/h</td></tr><tr><td>AVG SPEED</td><td>${Number(r.avg_speed_kmh||0).toFixed(1)} km/h</td></tr></tbody></table><div class="tiny" style="margin-top:13px;text-align:center">▶ ENTER: NEW RUN</div>`+footer('▲▼ LAST/BEST','◀ MENU')}
else if(page==='history'){let items=records.length?records.slice(0,6).map((r,i)=>({label:`RUN ${records.length-i} · ${r.target_m}m`,value:`${Number(r.top_speed_kmh).toFixed(1)} KM/H`})):[{label:'NO RECORDED RUNS'}];s.innerHTML=top('HISTORY')+rows(items,Math.min(sel,items.length-1))+footer('▲▼ SELECT','▶ DETAILS')}
else if(page==='historyDetail'){let r=records[sel]||records[0];s.innerHTML=top('RUN DETAILS')+(r?`<table class="discipline-table"><tbody><tr><td>DATE</td><td>${esc(new Date(r.date).toLocaleDateString('id-ID'))}</td></tr><tr><td>TARGET</td><td>${r.target_m} m</td></tr><tr><td>DISTANCE</td><td>${r.distance_m} m</td></tr><tr><td>TIME</td><td>${elapsedFmt(r.time_ms)}</td></tr><tr><td>TOP SPEED</td><td>${r.top_speed_kmh} km/h</td></tr><tr><td>STATUS</td><td>${esc(r.status)}</td></tr></tbody></table>`:'NO DATA')+footer('','◀ BACK')}
else if(page==='settings'){let items=[{label:'Units',value:settings.units},{label:'GPS Status',value:fix?'FIX':gps?'SEARCH':'OFF'},{label:'1 ft Rollout',value:settings.rollout},{label:'Export CSV',value:'▶'},{label:'Clear History',value:'▶'},{label:'Device Info',value:'▶'}];s.innerHTML=top('SETTINGS')+rows(items,sel)+footer('▲▼ SELECT','▶ CHANGE')}
else if(page==='gps'){s.innerHTML=top('GPS STATUS')+`<table class="discipline-table"><tbody><tr><td>RECEIVER</td><td>${gps?'ACTIVE':'OFF'}</td></tr><tr><td>POSITION</td><td>${fix?'FIX':'NO FIX'}</td></tr><tr><td>ACCURACY</td><td>${last&&last.accuracy?last.accuracy.toFixed(1)+' m':'--'}</td></tr><tr><td>SPEED</td><td>${last&&last.speed!=null?(last.speed*3.6).toFixed(1):'0.0'} km/h</td></tr></tbody></table>`+footer('','◀ BACK')}
else if(page==='lap'){s.innerHTML=top('LAP TIMER')+`<div class="center-screen"><div class="tiny">TRACK TIMING</div><div class="tiny">GPS TRACK DATABASE NOT AVAILABLE</div><div class="tiny">IN THIS WEB VERSION</div></div>`+footer('','◀ BACK')}
else if(page==='custom'){s.innerHTML=top('CUSTOM DISTANCE')+`<div class="center-screen"><div class="tiny">TARGET DISTANCE</div><div style="font-size:38px">${custom} m</div><div class="tiny">▲▼ CHANGE · ▶ CONFIRM</div></div>`+footer('▲▼ CHANGE','▶ CONFIRM')}
}
function elapsedFmt(ms){let sec=Math.max(0,ms)/1000;return `${Math.floor(sec/60).toString().padStart(2,'0')}:${(sec%60).toFixed(2).padStart(5,'0')}`}function targetFor(item){if(mode==='Distance'){if(item==='60 ft')return 18.288;if(item==='Custom')return custom;return Number(item.split(' ')[0])||200}if(mode==='Speed'){let nums=item.match(/\d+/g).map(Number);return nums[nums.length-1]}return custom}
function enter(){if(page==='boot'){page='main';sel=0;status('Main menu. Gunakan panah untuk memilih.')}else if(page==='main'){let m=menus[sel];if(m==='Drag Meter'){page='dragModes';sel=0}else if(m==='History'){page='history';sel=0}else if(m==='Settings'){page='settings';sel=0}else{page='lap';sel=0}}else if(page==='dragModes'){mode=['Speed','Distance','Custom'][sel];page='discipline';sel=0}else if(page==='discipline'){let opts=mode==='Speed'?speedModes:mode==='Distance'?distModes:['Custom interval'];let item=opts[sel];if(mode==='Distance'&&item==='Custom'){page='custom';return render()}target=targetFor(item);if(mode==='Speed'){testStartSpeed(item,target)}else startTest(target,item);return}else if(page==='custom'){target=custom;mode='Distance';page='running';startTest(target,'Custom');return}else if(page==='summary'){page='discipline';sel=0;lastSummary=null;status('Siap untuk run baru.')}else if(page==='history'){if(records.length){page='historyDetail';sel=Math.min(sel,records.length-1)}}else if(page==='historyDetail'){page='history'}else if(page==='settings'){if(sel===0){settings.units=settings.units==='km/h'?'mph':'km/h'}else if(sel===1){page='gps'}else if(sel===2){settings.rollout=settings.rollout==='OFF'?'ON':'OFF'}else if(sel===3){exportCSV()}else if(sel===4){if(confirm('Hapus semua riwayat?')){records=[];save();status('Riwayat dihapus.')}}else if(sel===5){status('RaceLab GPS · Web LCD UI')}save()}render()}
function back(){if(page==='boot'){page='main';sel=0}else if(page==='main'){page='boot'}else if(page==='dragModes'){page='main';sel=1}else if(page==='discipline'){page='dragModes';sel=0}else if(page==='custom'){page='discipline';sel=distModes.indexOf('Custom')}else if(page==='countdown'||page==='go'){test=null;page='discipline';sel=0;status('Tes dibatalkan.')}else if(page==='running'){finish(true);return}else if(page==='summary'){page='main';sel=1}else if(page==='history'){page='main';sel=2}else if(page==='historyDetail'){page='history'}else if(page==='settings'||page==='lap'||page==='gps'){page='main';sel=page==='settings'?3:0}else page='main';render()}
function move(d){if(page==='main')sel=(sel+d+menus.length)%menus.length;else if(page==='dragModes')sel=(sel+d+3)%3;else if(page==='discipline'){let a=mode==='Speed'?speedModes:mode==='Distance'?distModes:['Custom interval'];sel=(sel+d+a.length)%a.length}else if(page==='history')sel=(sel+d+Math.max(1,Math.min(records.length,6)))%Math.max(1,Math.min(records.length,6));else if(page==='settings')sel=(sel+d+6)%6;else if(page==='custom')custom=Math.max(20,Math.min(10000,custom+d*10));else if(page==='running'){test.display=(test.display||0)+d;status('Run sedang direkam. Tekan BACK untuk mengakhiri.')}else if(page==='summary'){status('Ringkasan run terakhir.')}render()}
function startGPS(){if(!navigator.geolocation){status('Browser tidak mendukung GPS.');return}if(!isSecureContext){status('GPS membutuhkan HTTPS.');return}if(gps){navigator.geolocation.clearWatch(watch);watch=null;gps=false;fix=false;status('GPS dimatikan.');render();return}gps=true;status('Mencari sinyal GPS...');watch=navigator.geolocation.watchPosition(pos=>{let c=pos.coords;last={lat:c.latitude,lon:c.longitude,accuracy:c.accuracy,speed:c.speed,t:pos.timestamp||Date.now()};fix=c.accuracy<=25;if(test){let p=last;let v=c.speed!=null?Math.max(0,c.speed*3.6):0;test.speed=v;if(test.phase==='armed'&&v>=3){test.phase='running';test.startTime=Date.now();test.last={...p};test.distance=0;status('GO · pengukuran dimulai saat gerakan terdeteksi')}else if(test.phase==='running'){if(test.last){let d=dist(test.last,p);if(d<Math.max(20,((p.t-test.last.t)/1000)*30))test.distance+=d}test.last={...p};test.top=Math.max(test.top,v);if(test.distance>=test.target)finish(false)}render()}else render();},e=>{fix=false;status('GPS error: izinkan lokasi dan coba di area terbuka.');render()},{enableHighAccuracy:true,maximumAge:0,timeout:20000})}
function dist(a,b){let R=6371000,rad=x=>x*Math.PI/180,d1=rad(b.lat-a.lat),d2=rad(b.lon-a.lon),x=Math.sin(d1/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.min(1,Math.sqrt(x)))}function startTest(t,label){if(!gps||!fix||!last){status('Aktifkan GPS dan tunggu GPS FIX sebelum mulai.');page='gps';render();return}target=t;test={target:t,targetLabel:label,distance:0,startTime:null,last:{...last},speed:0,top:0,phase:'countdown',count:5,countdownEnd:Date.now()+1000};page='countdown';status('Countdown dimulai. Bersiap di tempat aman.');render()}function testStartSpeed(label,t){if(!gps||!fix||!last){status('Aktifkan GPS dan tunggu GPS FIX sebelum mulai.');page='gps';render();return}target=t;test={target:t,targetLabel:label,distance:0,startTime:null,last:{...last},speed:0,top:0,speedMode:true,phase:'countdown',count:5,countdownEnd:Date.now()+1000};page='countdown';status('Countdown dimulai. Bersiap di tempat aman.');render()}
function finish(stopped){if(!test){page='main';render();return}let t=test;test=null;let ms=Date.now()-t.startTime;lastSummary={date:new Date().toISOString(),target_m:t.target,distance_m:+t.distance.toFixed(1),time_ms:ms,time_s:+(ms/1000).toFixed(2),top_speed_kmh:+t.top.toFixed(1),avg_speed_kmh:ms?t.distance/(ms/1000)*3.6:0,status:stopped?'Manual Stop':'Finish',mode};records.unshift(lastSummary);records=records.slice(0,500);save();page='summary';sel=0;status(stopped?'Run dihentikan. Hasil tersimpan.':'Finish! Hasil tersimpan.');render()}
function exportCSV(){if(!records.length){status('Belum ada hasil untuk diekspor.');return}let csv='Date,Target_m,Distance_m,Time_s,TopSpeed_kmh,Average_kmh,Status\r\n'+records.map(r=>[r.date,r.target_m,r.distance_m,r.time_s,r.top_speed_kmh,+r.avg_speed_kmh.toFixed(1),r.status].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='RaceLab-GPS-History.csv';a.click();URL.revokeObjectURL(u);status('CSV diekspor.')}
$('up').onclick=()=>move(-1);$('down').onclick=()=>move(1);$('enter').onclick=enter;$('back').onclick=back;document.addEventListener('keydown',e=>{if(e.key==='ArrowUp'){e.preventDefault();move(-1)}else if(e.key==='ArrowDown'){e.preventDefault();move(1)}else if(e.key==='Enter'||e.key==='ArrowRight'){e.preventDefault();enter()}else if(e.key==='Escape'||e.key==='ArrowLeft'){e.preventDefault();back()}else if(e.key.toLowerCase()==='g')startGPS()});$('gpsText').addEventListener('click',startGPS);$('battery').addEventListener('click',startGPS);render();
setInterval(()=>{if(test&&page==='countdown'){if(Date.now()>=test.countdownEnd){test.count--;if(test.count<=0){page='go';test.phase='go';test.goEnd=Date.now()+1500;status('GO! Menunggu gerakan GPS.')}else test.countdownEnd=Date.now()+1000}render()}else if(test&&page==='go'&&Date.now()>=test.goEnd){test.phase='armed';page='running';status('GO · mulai bergerak untuk memulai pengukuran');render()}else if(test&&page==='running'){if(!last||!gps)return;render()}},200);
})();
