
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101112">
<title>RaceLab GPS</title>
<style>
:root {
  --bg:#101112;
  --case:#202223;
  --lcd:#bfc1b7;
  --ink:#191b18;
  --red:#d4383c;
}
* { box-sizing:border-box; }
body {
  margin:0;
  background:radial-gradient(ellipse at top,#393b3b,#101112 75%);
  color:#eee;
  font-family:Arial,sans-serif;
  min-height:100dvh;
}
.wrap {
  width:min(1100px,100%);
  margin:auto;
  padding:12px;
}
.device {
  display:grid;
  grid-template-columns:clamp(48px,8vw,85px) minmax(0,1fr) clamp(48px,8vw,85px);
  grid-template-rows:auto minmax(280px,1fr) auto;
  grid-template-areas:"brand brand brand" "left lcd right" "legend legend legend";
  gap:9px;
  padding:13px;
  min-height:75vh;
  border:1px solid #555;
  border-radius:25px;
  background:linear-gradient(135deg,#555,#181919 25%,#090909 70%,#414242);
  box-shadow:0 20px 45px #000a,inset 0 1px 1px #aaa;
}
.brand {
  grid-area:brand;
  display:flex;
  align-items:center;
  justify-content:space-between;
  min-height:23px;
  padding:0 5px;
  font-size:12px;
  font-weight:900;
  letter-spacing:2px;
}
.brand span { color:var(--red); }
.brand small { color:#888; font-size:8px; }
.lcd {
  grid-area:lcd;
  min-width:0;
  min-height:0;
  height:100%;
  overflow:hidden;
  position:relative;
  color:var(--ink);
  background:linear-gradient(145deg,#d4d5cb,#bfc1b7 55%,#a6a99f);
  border:4px solid #080909;
  border-radius:5px;
  box-shadow:inset 0 0 0 1px #73766d,inset 0 0 20px #5556;
  font-family:"Courier New",monospace;
  font-weight:bold;
  text-transform:uppercase;
}
.lcdtop {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  height:31px;
  padding:4px 9px;
  border-bottom:1px solid #777;
  font-size:clamp(10px,1.5vw,14px);
}
#gpsText {
  cursor:pointer;
  border:0;
  background:transparent;
  color:inherit;
  font:inherit;
  font-weight:bold;
  padding:3px;
}
.screen {
  height:calc(100% - 31px);
  min-height:0;
  overflow:auto;
  padding:10px;
  position:relative;
}
.heading {
  text-align:center;
  border-bottom:1px solid #7d8076;
  padding:5px 0 9px;
  margin-bottom:8px;
  font-size:clamp(13px,2vw,20px);
}
.row {
  display:flex;
  align-items:center;
  gap:6px;
  min-height:clamp(35px,6vh,49px);
  padding:5px 8px;
  font-size:clamp(13px,1.8vw,20px);
}
.row .value { margin-left:auto; font-size:.8em; }
.row.selected { background:#292c27; color:#eee; }
.center {
  min-height:200px;
  height:calc(100% - 45px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:9px;
  text-align:center;
}
.logo { font-size:clamp(27px,5vw,48px); letter-spacing:-2px; }
.logo span { color:var(--red); }
.big { font-size:clamp(42px,8vw,82px); line-height:1; letter-spacing:-4px; }
.count { font-size:clamp(70px,13vw,130px); line-height:1; }
.small { font-size:clamp(10px,1.4vw,14px); }
.metrics {
  display:grid;
  grid-template-columns:1fr 1fr;
  width:100%;
  margin-top:12px;
  border-top:1px solid #777;
}
.metric { padding:10px 4px; text-align:center; }
.metric+ .metric { border-left:1px solid #777; }
.metric label { display:block; font-size:10px; }
.metric strong { display:block; font-size:clamp(18px,3vw,29px); margin-top:5px; }
.footer {
  position:sticky;
  bottom:-10px;
  display:flex;
  justify-content:space-between;
  padding:7px 2px 1px;
  margin-top:8px;
  background:#bfc1b7;
  border-top:1px solid #777;
  font-size:10px;
}
.keys { display:contents; }
.key {
  width:100%;
  height:clamp(52px,12vh,85px);
  border:1px solid #050505;
  border-radius:10px;
  color:#eee;
  background:linear-gradient(#505253,#171819 60%,#080808);
  box-shadow:0 3px 0 #050505,inset 0 1px #777;
  font-size:clamp(17px,2.5vw,25px);
  font-weight:bold;
  touch-action:manipulation;
}
.key small { display:block; font-size:8px; color:#aaa; }
.key:active { transform:translateY(2px); }
#up { grid-column:1;grid-row:2;align-self:start;margin-top:12%; }
#down { grid-column:1;grid-row:2;align-self:end;margin-bottom:12%; }
#back { grid-column:3;grid-row:2;align-self:start;margin-top:12%; }
#enter { grid-column:3;grid-row:2;align-self:end;margin-bottom:12%; }
.legend {
  grid-area:legend;
  display:flex;
  justify-content:space-between;
  color:#888;
  font-size:9px;
  letter-spacing:1px;
  padding:2px 5px 0;
}
.status {
  min-height:20px;
  text-align:center;
  font-size:11px;
  color:#ddd;
  margin-top:9px;
  line-height:1.4;
}
.guide {
  margin-top:10px;
  padding:10px;
  border:1px solid #444;
  border-radius:9px;
  color:#ddd;
  background:#202223;
  font-size:12px;
  line-height:1.5;
}
.guide b { color:#ff6b6e; }
table { width:100%; border-collapse:collapse; font-size:12px; }
td { padding:8px 4px; border-bottom:1px solid #898b81; }
td:last-child { text-align:right; }
@media (orientation:landscape) {
  .wrap { padding:7px; }
  .device { height:calc(100dvh - 90px); min-height:280px; max-height:720px; }
}
@media (orientation:portrait) {
  body { overflow:hidden; }
  .wrap {
    position:fixed;
    top:0;
    left:0;
    width:100dvh;
    height:100vw;
    max-width:none;
    transform-origin:top left;
    transform:rotate(90deg) translateY(-100%);
    padding:5px;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .device {
    width:100%;
    height:calc(100% - 61px);
    min-height:0;
    padding:7px;
    gap:5px;
    grid-template-rows:auto minmax(0,1fr) auto;
  }
  .lcdtop { height:24px; }
  .screen { height:calc(100% - 24px); padding:5px; }
  .heading { padding:3px 0 5px; margin-bottom:4px; }
  .row { min-height:29px; }
  .key { height:clamp(42px,12vh,65px); }
  .guide { font-size:10px; padding:5px 8px; margin-top:4px; }
  .status { font-size:10px; margin-top:4px; }
}
</style>
</head>
<body>
<main class="wrap">
  <section class="device">
    <div class="brand">
      <div>RACE<span>LAB</span> <small>GPS PERFORMANCE</small></div>
      <small>RL-GPS / 01</small>
    </div>

    <div class="lcd">
      <div class="lcdtop">
        <span>RACELAB GPS</span>
        <button id="gpsText" title="Tekan untuk mengaktifkan GPS">NO FIX</button>
      </div>
      <div id="screen" class="screen"></div>
    </div>

    <div class="keys">
      <button class="key" id="up">▲<small>UP</small></button>
      <button class="key" id="down">▼<small>DOWN</small></button>
      <button class="key" id="back">◀<small>BACK</small></button>
      <button class="key" id="enter">▶<small>ENTER</small></button>
    </div>

    <div class="legend">
      <span>GPS PERFORMANCE</span>
      <span>RACELAB GPS</span>
    </div>
  </section>

  <div class="status" id="status">Tekan ENTER untuk mulai.</div>
  <div class="guide">
    <b>PANDUAN GPS:</b> Ketuk tulisan NO FIX di kanan atas LCD.
    Izinkan akses lokasi di Chrome, lalu tunggu sampai GPS FIX.
    Gunakan di area terbuka. Jangan mengoperasikan perangkat saat berkendara.
  </div>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const screen = $("screen");
  const statusEl = $("status");

  const menus = ["Lap Timer","Drag Meter","History","Settings"];
  const dragModes = ["Speed","Distance","Custom"];
  const speedModes = ["0-60 km/h","0-80 km/h","0-100 km/h"];
  const distanceModes = ["100 m","200 m","201 m","402 m","Custom"];

  let page = "boot";
  let sel = 0;
  let mode = "Distance";
  let custom = 200;
  let target = 200;
  let gps = false;
  let fix = false;
  let watch = null;
  let last = null;
  let test = null;
  let records = [];
  let settings = {units:"km/h"};
  let lastSummary = null;

  try {
    const saved = JSON.parse(localStorage.getItem("racelabData") || "{}");
    records = Array.isArray(saved.records) ? saved.records : [];
    settings = saved.settings || settings;
    test = saved.test || null;
    if (test) {
      page = test.page || "running";
      if (["countdown","go","running"].includes(page)) {
        test.phase = page === "running" ? (test.phase || "armed") : test.phase;
      }
    }
  } catch(e) {}

  function save() {
    try {
      localStorage.setItem("racelabData", JSON.stringify({
        records: records,
        settings: settings,
        test: test ? {...test,page:page} : null
      }));
    } catch(e) {}
  }

  function status(message) {
    statusEl.textContent = message;
  }

  function fmtTime(ms) {
    ms = Math.max(0, Number(ms) || 0);
    return (ms/1000).toFixed(2) + " s";
  }

  function top(title) {
    return `<div class="heading">${title}</div>`;
  }

  function rows(items, selected) {
    return `<div>${items.map((item,i) => `
      <div class="row ${i===selected?"selected":""}">
        <span>${i===selected?"▶":" "}</span>
        <span>${item.label || item}</span>
        ${item.value!==undefined?`<span class="value">${item.value}</span>`:""}
      </div>`).join("")}</div>`;
  }

  function footer(left="▲▼ SELECT", right="▶ ENTER") {
    return `<div class="footer"><span>${left}</span><span>${right}</span></div>`;
  }

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[c]));
  }

  function render() {
    $("gpsText").textContent = fix ? "GPS FIX" : gps ? "SEARCH" : "NO FIX";

    if (page === "boot") {
      screen.innerHTML = `
        <div class="center">
          <div class="logo">RACE<span>LAB</span></div>
          <div class="small">GPS PERFORMANCE METER</div>
          <div style="width:65%;height:3px;background:#c63235"></div>
          <div class="small">PRESS ENTER TO START</div>
        </div>`;
    } else if (page === "main") {
      screen.innerHTML = top("MAIN MENU") + rows(menus,sel) +
        footer("▲▼ SELECT","▶ OPEN");
    } else if (page === "dragModes") {
      screen.innerHTML = top("DRAG METER") + rows(dragModes,sel) +
        footer("▲▼ SELECT","▶ ENTER");
    } else if (page === "discipline") {
      let options = mode === "Speed" ? speedModes :
        mode === "Distance" ? distanceModes : ["Custom interval"];
      screen.innerHTML = top(mode + " TEST") + rows(options,sel) +
        footer("▲▼ SELECT","▶ START");
    } else if (page === "custom") {
      screen.innerHTML = top("CUSTOM DISTANCE") + `
        <div class="center">
          <div class="small">TARGET DISTANCE</div>
          <div class="big">${custom}</div>
          <div>METERS</div>
          <div class="small">▲▼ CHANGE · ▶ CONFIRM</div>
        </div>` + footer("▲▼ CHANGE","▶ CONFIRM");
    } else if (page === "gps") {
      screen.innerHTML = top("GPS STATUS") + `
        <table>
          <tr><td>RECEIVER</td><td>${gps?"ACTIVE":"OFF"}</td></tr>
          <tr><td>POSITION</td><td>${fix?"GPS FIX":"NO FIX"}</td></tr>
          <tr><td>ACCURACY</td><td>${last?last.accuracy.toFixed(1)+" m":"--"}</td></tr>
          <tr><td>SPEED</td><td>${last && last.speed!=null?(last.speed*3.6).toFixed(1):"0.0"} km/h</td></tr>
        </table>` + footer("","◀ BACK");
    } else if (page === "countdown") {
      screen.innerHTML = top("GET READY") + `
        <div class="center">
          <div class="small">${esc(test?.label || "DRAG TEST")}</div>
          <div class="count">${test?.count ?? 5}</div>
          <div>PREPARE</div>
        </div>`;
    } else if (page === "go") {
      screen.innerHTML = top("DRAG METER") + `
        <div class="center">
          <div class="count">GO!</div>
          <div>START MOVING</div>
          <div class="small">TIMER STARTS WHEN GPS DETECTS MOVEMENT</div>
        </div>`;
    } else if (page === "running") {
      screen.innerHTML = top("TEST RUNNING") + `
        <div class="run-top">
          <span>${esc(test?.label || "TEST")}</span>
          <span>${test?.speedMode ? "SPEED" : "DISTANCE"}</span>
        </div>
        <div class="center" style="height:auto;min-height:0;padding:7px 0">
          <div class="small">LIVE SPEED</div>
          <div class="big">${(test?.speed || 0).toFixed(1)}</div>
          <div>KM/H</div>
        </div>
        <div class="metrics">
          <div class="metric"><label>DISTANCE</label><strong>${(test?.distance || 0).toFixed(1)} m</strong></div>
          <div class="metric"><label>TOP SPEED</label><strong>${(test?.top || 0).toFixed(1)} km/h</strong></div>
          <div class="metric"><label>TIME</label><strong>${fmtTime(test?.startTime ? Date.now()-test.startTime : 0)}</strong></div>
          <div class="metric"><label>TARGET</label><strong>${test?.target} ${test?.speedMode?"km/h":"m"}</strong></div>
        </div>` + footer("","◀ STOP");
    } else if (page === "summary") {
      const r = lastSummary;
      screen.innerHTML = top("TEST RESULT") + (r ? `
        <table>
          <tr><td>MODE</td><td>${esc(r.label)}</td></tr>
          <tr><td>DISTANCE</td><td>${r.distance_m} m</td></tr>
          <tr><td>TIME</td><td>${r.time_s} s</td></tr>
          <tr><td>TOP SPEED</td><td>${r.top_speed_kmh} km/h</td></tr>
          <tr><td>STATUS</td><td>${esc(r.status)}</td></tr>
        </table>
        <div class="small" style="margin-top:12px;text-align:center">ENTER = TES BARU</div>`:"NO DATA") +
        footer("","▶ ULANGI");
    } else if (page === "history") {
      const items = records.slice(0,8).map(r => ({
        label:new Date(r.date).toLocaleDateString("id-ID"),
        value:r.top_speed_kmh+" km/h"
      }));
      screen.innerHTML = top("TEST HISTORY") +
        (items.length ? rows(items,sel) : '<div class="center">NO HISTORY</div>') +
        footer("▲▼ SELECT","▶ DETAIL");
    } else if (page === "historyDetail") {
      const r = records[sel];
      screen.innerHTML = top("RESULT DETAIL") + (r ? `
        <table>
          <tr><td>DATE</td><td>${esc(new Date(r.date).toLocaleString("id-ID"))}</td></tr>
          <tr><td>TEST</td><td>${esc(r.label)}</td></tr>
          <tr><td>TARGET</td><td>${r.target}</td></tr>
          <tr><td>DISTANCE</td><td>${r.distance_m} m</td></tr>
          <tr><td>TIME</td><td>${r.time_s} s</td></tr>
          <tr><td>TOP SPEED</td><td>${r.top_speed_kmh} km/h</td></tr>
        </table>`:"NO DATA") + footer("","◀ BACK");
    } else if (page === "settings") {
      screen.innerHTML = top("SETTINGS") + rows([
        {label:"Units",value:settings.units},
        {label:"GPS Status",value:fix?"FIX":gps?"SEARCH":"OFF"},
        {label:"Export CSV",value:"▶"},
        {label:"Clear History",value:"▶"}
      ],sel) + footer("▲▼ SELECT","▶ CHANGE");
    } else if (page === "lap") {
      screen.innerHTML = top("LAP TIMER") + `
        <div class="center">
          <div>LAP TIMER</div>
          <div class="small">GPS LAP TRACKING</div>
          <div class="small">NOT AVAILABLE IN THIS VERSION</div>
        </div>` + footer("","◀ BACK");
    }
  }

  function dist(a,b) {
    const R=6371000;
    const rad=x=>x*Math.PI/180;
    const d1=rad(b.lat-a.lat),d2=rad(b.lon-a.lon);
    const x=Math.sin(d1/2)**2+
      Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(d2/2)**2;
    return 2*R*Math.asin(Math.min(1,Math.sqrt(x)));
  }

  function startGPS() {
    if (!navigator.geolocation) {
      status("Browser ini tidak mendukung GPS.");
      return;
    }
    if (!window.isSecureContext) {
      status("GPS membutuhkan HTTPS. Gunakan GitHub Pages atau Vercel.");
      return;
    }
    if (gps) {
      status(fix ? "GPS FIX aktif." : "Sedang mencari lokasi GPS...");
      return;
    }

    gps=true;
    fix=false;
    render();
    status("Meminta izin lokasi. Pilih Izinkan di Chrome.");

    try {
      watch=navigator.geolocation.watchPosition(pos=>{
        const c=pos.coords;
        last={
          lat:c.latitude,
          lon:c.longitude,
          accuracy:Number.isFinite(c.accuracy)?c.accuracy:9999,
          speed:c.speed,
          t:pos.timestamp || Date.now()
        };
        fix=last.accuracy<=50;

        if (test) {
          const v=c.speed!=null?Math.max(0,c.speed*3.6):0;
          test.speed=v;

          if (test.phase==="armed" && v>=3) {
            test.phase="running";
            test.startTime=Date.now();
            test.last={...last};
            test.distance=0;
            page="running";
            status("Pengukuran dimulai.");
          } else if (test.phase==="running") {
            if (test.last) {
              const d=dist(test.last,last);
              const dt=Math.max(0,(last.t-test.last.t)/1000);
              if (d<Math.max(20,dt*30)) test.distance+=d;
            }
            test.last={...last};
            test.top=Math.max(test.top,v);

            if (!test.speedMode && test.distance>=test.target) {
              finish(false);
              return;
            }
            if (test.speedMode && v>=test.target) {
              finish(false);
              return;
            }
          }
        }

        save();
        render();
        status(fix ?
          "GPS FIX · AKURASI "+last.accuracy.toFixed(0)+" M" :
          "SEARCH · AKURASI "+last.accuracy.toFixed(0)+" M");
      },err=>{
        fix=false;
        if (err.code===1) {
          gps=false;
          status("Izin lokasi ditolak. Izinkan lokasi untuk Chrome.");
        } else if (err.code===2) {
          status("Posisi tidak tersedia. Coba di luar ruangan.");
        } else if (err.code===3) {
          status("GPS timeout. Periksa GPS HP dan coba lagi.");
        } else {
          status("GPS error. Periksa izin lokasi.");
        }
        render();
      },{
        enableHighAccuracy:true,
        maximumAge:0,
        timeout:30000
      });
    } catch(e) {
      gps=false;
      status("Gagal mengaktifkan GPS.");
    }
  }

  function beginTest(t,label,speedMode=false) {
    if (!gps || !fix || !last) {
      page="gps";
      render();
      status("Aktifkan GPS dan tunggu sampai GPS FIX.");
      return;
    }

    target=t;
    test={
      label:label,
      target:t,
      speedMode:speedMode,
      distance:0,
      speed:0,
      top:0,
      startTime:null,
      last:{...last},
      phase:"countdown",
      count:5,
      countdownEnd:Date.now()+1000
    };
    page="countdown";
    save();
    status("Countdown dimulai. Pastikan lokasi aman.");
    render();
  }

  function finish(stopped) {
    if (!test) return;
    const t=test;
    const elapsed=t.startTime ? Date.now()-t.startTime : 0;
    lastSummary={
      date:new Date().toISOString(),
      label:t.label,
      target:t.target,
      distance_m:+t.distance.toFixed(1),
      time_s:+(elapsed/1000).toFixed(2),
      top_speed_kmh:+t.top.toFixed(1),
      status:stopped?"Manual Stop":"Finish"
    };
    records.unshift(lastSummary);
    records=records.slice(0,500);
    test=null;
    page="summary";
    sel=0;
    save();
    render();
    status(stopped?"Tes dihentikan. Hasil tersimpan.":"Tes selesai. Hasil tersimpan.");
  }

  function exportCSV() {
    if (!records.length) {
      status("Belum ada hasil untuk diekspor.");
      return;
    }
    const header=["Date","Test","Target","Distance_m","Time_s","TopSpeed_kmh","Status"];
    const lines=[header,...records.map(r=>[
      r.date,r.label,r.target,r.distance_m,r.time_s,r.top_speed_kmh,r.status
    ])];
    const csv=lines.map(row=>row.map(v=>
      '"'+String(v??"").replace(/"/g,'""')+'"'
    ).join(",")).join("\r\n");

    const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="RaceLab-GPS-History.csv";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    status("File riwayat CSV dibuat.");
  }

  function enter() {
    if (page==="boot") {
      page="main"; sel=0;
    } else if (page==="main") {
      if (sel===0) page="lap";
      if (sel===1) {page="dragModes";sel=0;}
      if (sel===2) {page="history";sel=0;}
      if (sel===3) {page="settings";sel=0;}
    } else if (page==="dragModes") {
      mode=dragModes[sel];
      page="discipline";
      sel=0;
    } else if (page==="discipline") {
      const opts=mode==="Speed"?speedModes:distanceModes;
      const item=opts[sel];

      if (mode==="Custom" || (mode==="Distance" && item==="Custom")) {
        page="custom";
        return render();
      }
      if (mode==="Speed") {
        const t=Number(item.match(/\d+/g).pop());
        beginTest(t,item,true);
      } else {
        const t=Number(item.split(" ")[0]);
        beginTest(t,item,false);
      }
      return;
    } else if (page==="custom") {
      mode="Distance";
      beginTest(custom,"Custom "+custom+" m",false);
      return;
    } else if (page==="summary") {
      page="dragModes"; sel=0; test=null;
      lastSummary=null;
      status("Siap untuk tes berikutnya.");
    } else if (page==="history") {
      if (records.length) {
        sel=Math.min(sel,records.length-1);
        page="historyDetail";
      }
    } else if (page==="historyDetail") {
      page="history";
    } else if (page==="settings") {
      if (sel===0) {
        settings.units=settings.units==="km/h"?"mph":"km/h";
        status("Unit diubah ke "+settings.units);
      } else if (sel===1) {
        page="gps";
      } else if (sel===2) {
        exportCSV();
      } else if (sel===3) {
        if (confirm("Hapus semua riwayat tes?")) {
          records=[];
          save();
          status("Riwayat dihapus.");
        }
      }
    }
    save();
    render();
  }

  function back() {
    if (page==="boot") page="main";
    else if (page==="main") page="boot";
    else if (page==="dragModes") {page="main";sel=1;}
    else if (page==="discipline") {page="dragModes";sel=0;}
    else if (page==="custom") {page="discipline";sel=0;}
    else if (page==="countdown" || page==="go") {
      test=null; page="discipline"; sel=0;
      save(); status("Tes dibatalkan.");
    } else if (page==="running") {
      finish(true);
      return;
    } else if (page==="summary") {
      page="dragModes"; sel=0;
    } else if (page==="history") {
      page="main"; sel=2;
    } else if (page==="historyDetail") {
      page="history";
    } else if (page==="settings" || page==="gps" || page==="lap") {
      const old=page;
      page="main";
      sel=old==="settings"?3:0;
    } else page="main";
    save();
    render();
  }

  function move(d) {
    if (page==="main") sel=(sel+d+menus.length)%menus.length;
    else if (page==="dragModes") sel=(sel+d+dragModes.length)%dragModes.length;
    else if (page==="discipline") {
      const opts=mode==="Speed"?speedModes:distanceModes;
      sel=(sel+d+opts.length)%opts.length;
    } else if (page==="history") {
      sel=(sel+d+Math.max(1,Math.min(records.length,8)))%
        Math.max(1,Math.min(records.length,8));
    } else if (page==="settings") sel=(sel+d+4)%4;
    else if (page==="custom") custom=Math.max(20,Math.min(10000,custom+d*10));
    render();
  }

  $("up").onclick=()=>move(-1);
  $("down").onclick=()=>move(1);
  $("enter").onclick=enter;
  $("back").onclick=back;
  $("gpsText").onclick=startGPS;

  document.addEventListener("keydown",e=>{
    if (e.key==="ArrowUp") {e.preventDefault();move(-1);}
    else if (e.key==="ArrowDown") {e.preventDefault();move(1);}
    else if (e.key==="Enter" || e.key==="ArrowRight") {e.preventDefault();enter();}
    else if (e.key==="Escape" || e.key==="ArrowLeft") {e.preventDefault();back();}
    else if (e.key.toLowerCase()==="g") startGPS();
  });

  if (test) {
    status("Tes dipulihkan. Ketuk NO FIX untuk menyambungkan GPS lagi.");
  }

  render();

  setInterval(()=>{
    if (test && page==="countdown") {
      if (Date.now()>=test.countdownEnd) {
        test.count--;
        if (test.count<=0) {
          page="go";
          test.phase="go";
          test.goEnd=Date.now()+1500;
          status("GO! Menunggu gerakan GPS.");
        } else {
          test.countdownEnd=Date.now()+1000;
        }
      }
      save();
      render();
    } else if (test && page==="go" && Date.now()>=test.goEnd) {
      test.phase="armed";
      page="running";
      status("GO! Mulai bergerak untuk memulai pengukuran.");
      save();
      render();
    } else if (test && page==="running") {
      save();
      render();
    }
  },200);
})();
</script>
</body>
</html>
